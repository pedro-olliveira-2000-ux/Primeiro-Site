<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Minha Primeira Pagina Web
    </h1>
    <p>
        Esta é minha primeira página desenvolvida na disciplina Programação Web.<br>
        
        Pedro Henrique da Silva Olivera
    </p>
    <section>
        <form action="" method="">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="campo">
                    <label for="nome" >Nome</label>
                    <input type="text" id="nome" name="nome">

                </div>
                 
                <div class="campo">
                    <label for="e-mail" >E-Mail</label>
                    <input type="email" id="e-mail" name="e-mail">
                    
                </div>

            </fieldset>
                <br>
            <fieldset>
                <legend> Mensagem</legend>
                <div class="campo">
                    <label for="assunto" >Assunto</label>
                    <input type="text" id="assunto" name="assunto" required>

                </div>
                <div class="campo">
                    <label for="mensagem" >Mensagem</label>
                    
                    <textarea rows="5" cols="40" type="text " id="mensagem" name="mensagem" required></textarea>
                </div>
            </fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </section>
    
</body>
</html>
