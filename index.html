<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>
            Minha Primeira Pagina Web
        </h1>
    </header>
    <p>
        Esta é minha primeira página desenvolvida na disciplina Programação Web.<br>
    </p>
    <p class="nome">

        Pedro Henrique da Silva Oliveira
    </p>
    <img src="img/134227373515774350.jpg">
    <section id="EntreEmContato">
        <form action="" method="">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">

                </div>

                <div class="campo">
                    <label for="e-mail">E-Mail</label>
                    <input type="email" id="e-mail" name="e-mail">

                </div>

            </fieldset>
            <br>
            <fieldset>
                <legend> Mensagem</legend>
                <div class="campo">
                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" name="assunto" required>

                </div>
                <div class="campo">
                    <label for="mensagem">Mensagem</label>

                    <textarea rows="5" cols="40" type="text " id="mensagem" name="mensagem" required></textarea>
                </div>
            </fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </section>
    <footer>
        <p>Desenvolvido por Pedro Henrique</p>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
